<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kib-YT-Flush</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-container">
    <header class="panel-header">
      <div class="brand">
        <h1 class="brand-title">Kib-YT-Flush</h1>
        <span class="badge" id="item-count-badge">0</span>
      </div>
      <p class="subtitle">Saved Watch Progress</p>
    </header>

    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search saved videos..." autocomplete="off" />
    </div>

    <main class="panel-content">
      <div id="video-list" class="video-list"></div>
      
      <div id="empty-state" class="empty-state hidden">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 01-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112z" />
        </svg>
        <p class="empty-text">No saved watch positions found.</p>
        <span class="empty-subtext">Videos you watch on YouTube will be saved here automatically.</span>
      </div>
    </main>

    <footer class="panel-footer">
      <button id="clear-all-btn" class="clear-btn">Clear All History</button>
    </footer>

    <!-- Confirmation Modal Dialog -->
    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 class="modal-title">Clear Watch History?</h3>
        <p class="modal-message">This will remove all saved watch positions and timestamps. This action cannot be undone.</p>
        <div class="modal-actions">
          <button id="cancel-modal-btn" class="modal-btn secondary-btn">Cancel</button>
          <button id="confirm-clear-btn" class="modal-btn danger-btn">Clear All</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
